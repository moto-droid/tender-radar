<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聯絡我們｜Replicator</title><link rel="stylesheet" href="contact.css"><link rel="stylesheet" href="misans.css"><script type="module" src="contact.js"></script><link rel="stylesheet" href="/ms-preferences.css"><script src="/ms-translations.js" defer></script><script src="/ms-preferences.js" defer></script></head><body data-site="Replicator"><header><a href="/"><img src="brand/motospatial.png" alt="Motospatial" width="423" height="102"></a><a href="/">← 返回 Replicator</a></header><main><section><p class="eyebrow">CONTACT / Replicator</p><h1>讓我們了解<br>你的需求。</h1><p>填寫需求後，選擇 Gmail 或預設郵件程式撰寫信件。我們會將網站名稱與聯絡資訊一併帶入。</p><a class="recipient" href="mailto:contact@motospatial.com">contact@motospatial.com</a><small>目前洽詢與測試統一寄至此信箱，不副本給其他人。</small><small>此表單不在網站儲存你的聯絡資料。郵件需由你在郵件程式中確認寄出；若尚未設定預設程式，可使用 Gmail 或複製信件內容。</small></section><form><div class="grid"><label>姓名（必填）<input name="name" required maxlength="80" autocomplete="name"></label><label>回覆 Email（必填）<input type="email" name="email" required maxlength="150" autocomplete="email"></label></div><label>公司／單位<input name="company" maxlength="120" autocomplete="organization"></label><label>洽詢主旨（必填）<input name="topic" required maxlength="100" value="合作與方案洽詢"></label><label>洽詢內容（必填）<textarea name="message" required maxlength="2000" placeholder="請描述需求、場域與預計時程。"></textarea></label><div class="actions"><button id="gmail" type="button" class="primary">使用 Gmail 撰寫</button><button type="submit">使用預設郵件程式</button></div><button id="copy" type="button">複製信件內容</button><p role="status" aria-live="polite"></p><textarea id="copy-text" aria-label="可複製的信件內容" readonly hidden></textarea></form></main><footer>Replicator · Motospatial</footer></body></html>
